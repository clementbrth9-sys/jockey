<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>MobiTrack</title>
<link rel="icon" type="image/png" href="logo-mark.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="app-header">
  <div class="header-side header-side-start">
    <img src="logo-mark.png" alt="Mobileo" class="header-mark" />
  </div>
  <h1 class="header-title">MobiTrack</h1>
  <div class="header-side header-side-end">
    <a href="/admin.html" id="link-admin" class="icon-btn hidden" aria-label="Tableau de bord" title="Tableau de bord">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="20" x2="6" y2="13"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="9"/></svg>
    </a>
    <button id="btn-logout" class="icon-btn" aria-label="Déconnexion" title="Déconnexion">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>
</header>

<main id="app">

  <!-- Ecran principal -->
  <section id="view-home" class="view">
    <div id="reconnect-banner" class="reconnect-banner hidden"></div>
    <div id="trajet-counter" class="trajet-counter"></div>
    <div id="trajet-status-card" class="hero-card"></div>

    <div class="quick-actions">
      <button id="btn-plein" class="quick-tile">
        <span class="quick-tile-icon quick-tile-icon-accent">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 22h10"/><path d="M6 18V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v14"/><path d="M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V7.5L18 5"/></svg>
        </span>
        <span class="quick-tile-label">Faire le plein</span>
      </button>
      <button id="btn-go-jour" class="quick-tile">
        <span class="quick-tile-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
        </span>
        <span class="quick-tile-label">Historique</span>
      </button>
    </div>
  </section>

  <!-- Ecran journee / consultation -->
  <section id="view-jour" class="view hidden">
    <div class="jour-header">
      <button id="btn-back-home" class="icon-btn" aria-label="Retour" title="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="date-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <input type="date" id="input-date" aria-label="Date consultée" />
      </div>
    </div>
    <div id="jour-summary" class="card"></div>
    <div id="jour-timeline"></div>
  </section>

</main>

<footer class="app-footer">Un outil du Groupe Mobileo</footer>

<!-- Modal fin de trajet -->
<div id="modal-finish" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-finish-title">
  <div class="modal-content">
    <h2 id="modal-finish-title">Terminer le trajet</h2>
    <form id="form-finish" novalidate>
      <div class="modal-body">
        <fieldset class="form-field" id="field-mission">
          <legend class="field-label">Type de mission</legend>
          <div class="radio-group" id="mission-type-group">
            <label class="chip"><input type="radio" name="missionType" value="Citiz"><span>Citiz</span></label>
            <label class="chip"><input type="radio" name="missionType" value="Controle technique"><span>Contrôle technique</span></label>
            <label class="chip"><input type="radio" name="missionType" value="Livraison"><span>Livraison</span></label>
            <label class="chip"><input type="radio" name="missionType" value="Autre"><span>Autre</span></label>
          </div>
        </fieldset>

        <div class="form-field hidden" id="field-mission-autre">
          <label class="field-label" for="mission-autre-input">Précisez la mission</label>
          <input type="text" id="mission-autre-input" class="text-input" autocomplete="off" maxlength="80" />
        </div>

        <div class="form-field hidden" id="field-centre">
          <label class="field-label" for="centre-livraison-select">Centre de livraison</label>
          <select id="centre-livraison-select" class="text-input">
            <option value="" disabled selected>Choisir un centre</option>
            <option value="Eckbolsheim">Eckbolsheim</option>
            <option value="Truchtersheim">Truchtersheim</option>
            <option value="Marlenheim">Marlenheim</option>
            <option value="Neudorf">Neudorf</option>
          </select>
        </div>

        <fieldset class="form-field" id="field-vehicule">
          <legend class="field-label">Véhicule utilisé</legend>
          <div class="radio-group" id="vehicule-group">
            <label class="chip"><input type="radio" name="vehicule" value="Relais Citiz"><span>Relais Citiz</span></label>
            <label class="chip"><input type="radio" name="vehicule" value="Vehicule perso"><span>Véhicule perso</span></label>
            <label class="chip"><input type="radio" name="vehicule" value="Vehicule controle technique"><span>Véhicule contrôle technique</span></label>
          </div>
        </fieldset>

        <fieldset class="form-field">
          <legend class="field-label">Parking payé ?</legend>
          <div class="radio-group">
            <label class="chip"><input type="radio" name="parkingPaye" value="non" checked><span>Non</span></label>
            <label class="chip"><input type="radio" name="parkingPaye" value="oui"><span>Oui</span></label>
          </div>
        </fieldset>

        <div class="form-field hidden" id="field-parking-montant">
          <label class="field-label" for="parking-montant-input">Montant du parking (€)</label>
          <input type="number" id="parking-montant-input" class="text-input" inputmode="decimal" step="0.01" min="0" max="100" placeholder="0,00" />
        </div>

        <div class="form-field" id="km-field">
          <label class="field-label" for="km-input">Kilomètres parcourus</label>
          <input type="number" id="km-input" class="text-input" inputmode="decimal" step="0.1" min="0" max="1000" placeholder="ex : 12,5" />
        </div>

        <div class="form-error hidden" id="finish-error" role="alert"></div>
      </div>

      <div class="modal-actions">
        <button type="button" id="btn-cancel-finish" class="btn btn-ghost">Annuler</button>
        <button type="submit" class="btn btn-primary">Valider</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal plein -->
<div id="modal-plein" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-plein-title">
  <div class="modal-content">
    <h2 id="modal-plein-title">Faire le plein</h2>
    <form id="form-plein" novalidate>
      <div class="modal-body">
        <fieldset class="form-field" id="field-vehicule-plein">
          <legend class="field-label">Véhicule</legend>
          <div class="radio-group">
            <label class="chip"><input type="radio" name="vehiculePlein" value="Relais Citiz"><span>Relais Citiz</span></label>
            <label class="chip"><input type="radio" name="vehiculePlein" value="Vehicule perso"><span>Véhicule perso</span></label>
            <label class="chip"><input type="radio" name="vehiculePlein" value="Vehicule controle technique"><span>Véhicule contrôle technique</span></label>
          </div>
        </fieldset>

        <div class="form-field" id="field-montant-plein">
          <label class="field-label" for="montant-plein-input">Montant (€)</label>
          <input type="number" id="montant-plein-input" class="text-input" inputmode="decimal" step="0.01" min="0.01" max="300" placeholder="0,00" />
        </div>

        <div class="form-error hidden" id="plein-error" role="alert"></div>
      </div>

      <div class="modal-actions">
        <button type="button" id="btn-cancel-plein" class="btn btn-ghost">Annuler</button>
        <button type="submit" class="btn btn-primary">Valider</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
