<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Connexion - Suivi Jockey</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="app-header">
  <div class="header-brand">
    <img src="logo.png" alt="Mobileo" class="header-logo" />
    <h1>Suivi Jockey</h1>
  </div>
</header>

<main id="app" class="login-main">
  <section class="view">
    <div class="card login-card">
      <div class="login-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <label for="password-input" class="field-label">Mot de passe</label>
      <input type="password" id="password-input" autofocus class="text-input" />
      <button id="btn-login" class="btn btn-primary btn-big">Se connecter</button>
      <div id="login-error" class="login-error hidden"></div>
    </div>
  </section>
</main>

<script src="login.js"></script>
</body>
</html>
