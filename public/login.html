<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Connexion - Suivi Jockey</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="app-header">
  <div class="header-brand">
    <img src="logo.png" alt="Mobileo" class="header-logo" />
    <h1>Suivi Jockey</h1>
  </div>
</header>

<main id="app">
  <section class="view">
    <div class="card">
      <label for="password-input" style="display:block; font-weight:600; margin-bottom:10px; color: var(--color-text-muted);">Mot de passe</label>
      <input type="password" id="password-input" autofocus style="width:100%; padding:14px; border-radius:12px; border:2px solid var(--color-border); font-size:1rem; margin-bottom:16px;" />
      <button id="btn-login" class="btn btn-primary btn-big">Se connecter</button>
      <div id="login-error" class="hidden" style="color: var(--color-danger); margin-top:12px; text-align:center; font-weight:600;"></div>
    </div>
  </section>
</main>

<script src="login.js"></script>
</body>
</html>
